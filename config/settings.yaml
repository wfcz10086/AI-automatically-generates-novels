# 全局创作配置 —— 所有项目继承，单个项目可覆盖任意一项。
# 优先级：项目 overrides > config/settings.local.yaml（UI 保存）> 本文件 > 代码内置默认
# 注意：UI 的「全局设置」只写 settings.local.yaml，不会覆盖本文件的注释。

generation:
  chapter_words_min: 2200        # 单章字数下限
  chapter_words_max: 3000        # 单章字数上限
  chapter_words_tolerance: 0.25  # 允许偏离比例，超出计入扣分
  outline_batch: 0               # 每批生成多少章细纲。0 = 按输出上限自动算
                                 # （8192 tok 约能排 20 章）。10 太少：写第 5 章时
                                 # 模型只知道 1-10 章，第 30 章的伏笔无从铺起
  max_tokens_draft: 8192         # 单次正文生成上限
  # 评审一遍要交 15 个维度的分 + 带原文引证的问题 + 新事实 + 口癖。
  # 原来写死 2000, 实测 30 章里 17 章被截断, 截断后 JSON 仍可能解析成功
  # 但缺 scores —— 那一遍就静默丢了, 章与章的分数不再可比。
  max_tokens_critique: 4000      # 单遍评审上限
  max_tokens_plan: 8000
  # 排纲单独一档：一批要出十几二十章细纲，8000 装不下，最后一章必被截断。
  # 输出上限只是天花板，按实际生成计费，给宽一点没有代价。
  max_tokens_outline: 20000
  # 一批最多排几章。小批次产出率高得多：实测 25 章一批时模型会漏写字段
  # （16 章里 6 章漏了「一句话」，整章被丢，产出率 40%），
  # 而且一次失败丢一整批。5 章一批模型拿得住，丢了也只丢 5 章。
  # 代价是固定开销（提示词、巡检、概要）摊薄不了 —— 所以下面把重活改成按章数触发。
  outline_batch_max: 5
  # 细纲最多领先正文多少章。0 = 不限（老行为：一口气排完全书）。
  # 一次排完是「剧情不连续」的根源 —— 实测某书 346 章细纲在正文只写了 6 章时
  # 两小时内全部排完，后一批细纲的输入只能是前一批细纲，永远不可能是正文。
  # 正文一偏离，后面三百多章细纲全部失效，而且没有任何东西知道。
  # 12 章：够铺三四十章之内的伏笔，又保证每一批都能看见已经写出来的正文。
  outline_lead: 12
  # 巡检 / 自审 / 概要不必每批都跑：批次小了之后每批只多五章，
  # 状态和套路都还没变，重跑一遍纯属浪费。按「距上次跑过多少章」触发。
  sweep_every: 10        # 巡检（伏笔/承诺/张力/支线/阶梯/赢法/挫败/台账）
  recap_every: 25        # 剧情概要重写（最贵，输出三千多字）
  selfcheck_every: 25    # 写法自审（要看够多的章才看得出套路）
  context_budget: auto           # 记忆体预算。auto = 按网关窗口推导（窗口 - 输出预留 - 安全垫）
  output_reserve: 8192           # 给正文输出留的 token
  safety_margin: 4000            # 中文 token 估算误差的安全垫
  min_context_budget: 32000      # 记忆体下限 —— 低于此值长篇一致性会崩
  max_context_budget: 100000     # 记忆体上限 —— 再大边际收益递减且拖慢生成
  temperature_draft: 0.92
  temperature_plan: 0.80

limits:
  max_chapters: 500              # 单本书章节上限
  max_total_words: 2000000       # 单本书总字数上限
  daily_call_budget: 0           # 0 = 不限；达到后停止生成，用于成本控制

quality:
  audit_pass_score: 70           # 低于此分自动重写
  max_rewrites: 1                # 每章最多重写次数
  hard_fail_on_blacklist: true   # 命中题材黑名单直接判不合格
  reflect_every: 5               # 每 N 章自审：读自己写的 → 批 → 更新写作守则，
                                 # 同时抽出机器可执行规则（禁用词/口癖/断线角色）自动生效
  critique_every_chapter: true   # 每章都让模型真读一遍并打分（统计指标测不出
                                 # 叙述拐杖/官职凭空升级/死了的人又活了这类问题）
  critique_passes: 2             # 每章读几遍：1=逻辑读 2=+文字读 3=+衔接读
                                 # 一遍读不出所有问题——逻辑遍盯剧情/设定/事实，
                                 # 文字遍盯文风/套路/描写配给/开篇钩子
  critique_budget_chars: 46000   # 评审上下文预算（约 64k token）。走索引与压缩，
                                 # 灌原文只装得下四五章，走 canon+摘要+召回能覆盖全书
  heal_every: 5                  # 每 N 章自愈一次：消费评审发现，自动执行
                                 # 档案更新/era卡增补/误禁复核/定点返修入队
  selfcheck_every: 20            # 每 N 章系统级自检：区分内容问题与系统缺陷
                                 # （漏检/误报/约束失效/配额错误），产出 SYSTEM_ISSUES.md

memory:
  enabled: true
  top_k: 16                      # 每次写作检索多少条相关记忆
  recent_chapters: 16            # 直接带入的最近章节摘要数
  # 原来 14 —— 每章把前 14 章的完整正文全塞进提示词, 实测第30章这一层占 57376 字,
  # 是「本章细纲」的 55 倍。带原文的目的是接住文风、称谓、临时长出来的细节,
  # 4 章足够; 再往前有摘要(16条)和段落摘要顶着。省下的是每章几万 token。
  recent_full: 4                 # 额外带几章「正文原文」——只给摘要模型接不住文风与细节
                                 # 这是窗口里最值钱的内容，实测把利用率从 21% 提到 60%
  foreshadow_show: 24            # 注入多少条未回收伏笔（分层挑选：告急+活跃+中段）
  l2_every: 10                   # 每 N 章压一次 L2 摘要
  index_chapters: true           # 正文入索引（支持「第 30 章埋的伏笔」检索）
  web_search: true               # L4 召回是否联网补事实
  web_max_per_chapter: 4         # 单章最多补几个知识点，查过的全书复用
  # 五层记忆的预算配比（占 context_budget 的比例，合计建议 <= 0.96）
  #   改这里就能控制「模型记住什么」：想更贴合远期伏笔就加大 L4_recall，
  #   想更贴紧最近剧情就加大 L2_recent。
  layers:
    L0_outline: 0.05             # 本章细纲（必进，永不裁剪）
    L1_resident: 0.20            # 世界观 + 考据卡 + 角色档案 + 题材规范（常驻）
    L2_recent: 0.38              # 最近章节：摘要 + 最近 N 章正文原文（占比最大）
    L3_mid: 0.12                 # 每 N 章的段摘要（分层压缩，丢最远）
    L4_recall: 0.18              # 检索召回（内部 FTS5 + 外部搜索合并）
    L5_constraint: 0.07          # 红线约束（必进，永不裁剪）

# 两个旋钮 —— 同时管剧情与文风，每本书可在前端单独覆盖。
# 爽度  = 回报有多猛、多密（爽点间隔、翻盘幅度、对手体量、打脸即时性）
# 狂野度 = 敢不敢失控（主角会不会真输、会不会死人、会不会毁掉已建起来的东西）
# 两者正交：爽高野低是标准套路爽文，爽高野高是疯批流，爽低野高是黑深残。
# 它们不只写进提示词，还直接驱动机制：狂野度定每阶段的挫败配额，
# 爽度定爽点必须出现的间隔 —— 提示词管风味，机制管底线。
dials:
  gratify: 70
  wild: 35

# 人物纪律 —— 对所有书、所有题材、所有内容类型生效。
# 排纲与写正文两处都注入：排纲阶段定死「谁在盘算什么」，正文阶段才演得出来。
# 来源：实测长篇里人物塌成工具的几种典型死法，每发现一种在此追加。
character_rules:
  # —— 不降智：这是长篇最伤读者的一种塌陷 ——
  - "任何人都不许为了让主角赢而突然变蠢：对手的每一步都必须是**站在他的位置上、用他知道的信息**能做出的最优解"
  - "主角赢，只能因为他多算了一层、或掌握了对方没有的信息、或肯付对方不肯付的代价——绝不能因为对手忘了常识"
  - "对手失败必须有**具体原因**（信息差／代价算错／被自己人拖累／赌了个小概率），不能只是「没想到」"
  - "反派的智商守恒：他前面能布下的局，后面就不该犯更低级的错"
  - "别人不是主角的捧哏：不许全场只会惊叹、附和、复述主角刚说过的话"

  # —— 有血有肉：每个人都得有自己的算盘 ——
  - "每个有名有姓的人出场时都带着**自己想要的东西**，且与主角的诉求不完全重合"
  - "配角会拒绝、会讨价还价、会阳奉阴违、会办砸、会有自己的小心思——不是接了命令就照办的执行器"
  - "情绪有残留：上一场受的气会带到下一场，不许每章重置成中立状态"
  - "同一个人在不同人面前不一样：对上级、对手下、对家里人的说法与口气要有差别"
  - "让人物有与剧情无关的一面（一个执念、一个毛病、一件私事），偶尔露一次就够，但要真的存在"

  # —— 不死板：人是会变的 ——
  - "立场可以变，但必须有**看得见的理由**（付了代价／被证明错了／利益变了）；变过之后不许悄悄变回去"
  - "别把人写成一句话标签：忠、狠、贪、痴这类词只能是读者读出来的结论，不能是人物的全部内容"
  - "同一个人在不同阶段承担不同的功能位（给予者→阻挡者→代价承受者），那才是成长；连续几个阶段一动不动就是工具人"
  - "关系会磨损也会加深：长期共事的人之间要有新增的默契或新增的芥蒂，不能一直停在初识时的距离"

# 全局去 AI 味纪律 —— 对所有书、所有文风生效（文风包 rules 只放题材特有的）。
# 来源：两本书实测的 AI 指纹清单，每发现新指纹在此追加。
anti_ai_rules:
  - "「不是A，是B」反转判断句每章最多 1 次——这是 AI 腔最重的指纹"
  - "比喻连接词「仿佛/宛如/犹如/像…般」每章合计最多 2 次；想比喻就直接写画面"
  - "动作不加心理注释：写「他放下核桃」就够，不写「摆出一副掌控全局的姿态」"
  - "对话别回合制：允许打断、抢话、答非所问、说一半停住"
  - "状态形容（眼神锐利/声音沙哑/脸色X白）每章限 1 次，用动作代替"
  - "禁止段末哲理点题（「这就是…」「在这个时代…」）"
  - "开篇第一句必须是对白、动作或突发事件，禁止环境/天气/氛围铺垫"
  - "情绪形容词（冰冷/深邃/压抑）每千字≤2；环境描写全章≤3处每处≤1句"
  - "禁用万金油结尾：「才刚刚开始」「安静得可怕」「好戏在后头」——钩子要具体（新威胁/反常细节/未接的消息）"
  - "对白要敢裸奔：每场关键对话至少一处 3 句以上连排干对白（不带任何神态动作说明），像连珠炮——「平不了。」「那就砍。」「砍了谁给你做账？」"
  - "神态动作是标点不是句子：对白之间的打断每处≤10字（「他笑了。」够了，别写「他嘴角堆起一副市侩的笑容」）"
  - "状态说一遍就够：写了「他慌了」就不要再跟「他知道自己在玩火」——读者不傻"

# 正文写作要求 —— 每章提示词都会带上，前端可改。
# 与 anti_ai_rules 的分工：这里管「怎么写才像网文」，那里管「怎么写才不像 AI」。
chapter_directives:
  - "语言是大白话：网文读者在手机上看，句子短、词常见，不用书面语和文艺腔（写「他慌了」不写「一股寒意攫住了他的心神」）"
  - "剧情靠动作和对话推进，不靠叙述交代：该演的别说：不写「两人爆发了激烈争吵」，直接把这场吵架演出来"
  - "少用总结性陈述：写完一场戏不要再补一句概括它的话，读者刚看完，不需要复述"
  - "对白要有身份：皇帝、太监、胥吏、武将、商人的用词与句式各不相同，光看台词就能认出是谁在说话"
  - "段落短：一段只写一个动作或一句话；具体字数区间由所选文风包的 paragraphChars 决定"
  - "细节要具体到可验证：写价钱写数目写物件的样子，不写「很贵」「很多」「很精致」"
  - "感情靠事做出来，不靠形容词说出来"

style_defaults:                  # 全局写作偏好，会拼进每次提示词
  narration: "第三人称限制视角"
  tense: "过去时"
  extra: ""                      # 自定义追加要求，例如「多用短句，少用比喻」

# 全局右键菜单 —— 选中正文右键即可用，对所有项目、所有内容类型生效。
# 合并顺序：全局（这里）> 内容类型包 > 题材包；同名以先出现的为准。
# 可用变量：${selected_text} ${background} ${characters} ${relationships}
#           ${plot} ${style} ${cliche_blacklist} ${title}
context_menus:
  - name: 扩写
    prompt: "把下面这段扩写到原来的 1.5 倍，增加细节与画面感，风格保持一致，直接输出改写结果：\n${selected_text}"
  - name: 缩写
    prompt: "把下面这段压缩到原来的 60%，保留全部关键信息与转折，直接输出：\n${selected_text}"
  - name: 润色
    prompt: "润色下面这段，语言更凝练有力，保留全部剧情，直接输出：\n${selected_text}"
  - name: 去 AI 味
    prompt: "改写下面这段，去掉套话与 AI 腔（禁用：${cliche_blacklist}），句式长短交错，直接输出：\n${selected_text}"
  - name: 加冲突
    prompt: "在下面这段中升级戏剧冲突，保持合理性，直接输出：\n${selected_text}"
  - name: 加钩子
    prompt: "改写下面这段的结尾，留一个让读者必须看下一章的钩子，直接输出：\n${selected_text}"
  - name: 转对白
    prompt: "把下面这段的叙述改写成人物对白推动，人物说话要有各自腔调，直接输出：\n${selected_text}"
  - name: 加细节
    prompt: "为下面这段补充可感知的细节（气味、触感、声音、光线），不加新情节，直接输出：\n${selected_text}"

banned_global:                   # 全局禁用词，与题材黑名单、自审学到的规则合并
  - "总而言之"
  - "综上所述"
  - "值得一提的是"
