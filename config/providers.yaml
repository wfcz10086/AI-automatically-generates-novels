# 模型网关配置
# ⚠️ 本文件进 git，因此不得出现任何真实地址或密钥 —— 一律 ${ENV} 引用。
#    真实值放 .env（已 gitignore）。加网关 = 加一段 YAML + 两个环境变量。

gateways:
  gw1:
    type: openai_compat
    label: "主力自建网关"
    base_url: ${NOVEL_GW1_URL}
    api_key: ${NOVEL_GW1_KEY:-EMPTY}
    default_model: ${NOVEL_GW1_MODEL}
    reasoning_field: reasoning        # vLLM 的非标准思考字段名
    context_window: 110000
    max_tokens: 8192

  gw2:
    type: openai_compat
    label: "备用自建网关"
    base_url: ${NOVEL_GW2_URL}
    api_key: ${NOVEL_GW2_KEY:-EMPTY}
    default_model: ${NOVEL_GW2_MODEL}
    reasoning_field: reasoning
    context_window: 80000
    max_tokens: 8192

  gw3:
    type: openai_compat
    label: "聚合网关"
    base_url: ${NOVEL_GW3_URL}
    api_key: ${NOVEL_GW3_KEY:-EMPTY}
    default_model: ${NOVEL_GW3_MODEL}
    reasoning_field: reasoning_content   # DeepSeek 系约定
    context_window: 128000
    max_tokens: 8192

  gw4:
    type: openai_compat
    label: "主网关"
    base_url: ${NOVEL_GW4_URL}
    api_key: ${NOVEL_GW4_KEY:-EMPTY}
    default_model: ${NOVEL_GW4_MODEL}
    reasoning_field: reasoning_content
    # GLM 系关不掉思考, 只能调档: 传 enable_thinking=false 会直接 400
    thinking_style: effort
    # 键必须加引号: YAML 1.1 会把 on/off 解析成布尔 true/false,
    # 于是 levels.get("on") 取不到值, 只能碰运气落到默认档
    thinking_levels: {"off": low, "on": high}
    # ⚠ 这是**聚合**网关, 上面同时挂着 glm / qwen / deepseek 三个族,
    # 而思考开关的形态是按模型族分的, 不是按网关分的:
    #   glm 关不掉, 只能调档(传 enable_thinking=false 直接 400)
    #   qwen 支持 enable_thinking=false, 能彻底关掉
    # 只配一个 thinking_style 必然有一族吃错参数 —— 实测同一条 6.2 万字提示词,
    # qwen3.8-flash 拿到 effort 档要 109s 且白烧 4096 思考 token, 不传参数直接
    # 4 分钟超时; 换成 toggle 后 **36s、思考 0**。按前缀覆盖:
    thinking_style_by_model:
      glm: effort
      zhipu: effort
      # qwen 走 toggle: thinking:false 时发 enable_thinking=false, 彻底关掉。
      # 若配成 effort, thinking:false 只会降到 low 档, 仍然烧思考 token。
      # ⚠ 实测代价(在 flash 上): 关思考后制度解说归零、叹号 10.98→1.28,
      #   文体指标从 8/8 掉到 5/8。要质量就把 profiles 的 thinking 改回 true。
      qwen: toggle
      deepseek: effort
    context_window: 128000
    # 实测该网关接受 32768。给到 20000：只按实际生成计费，给宽没有代价，
    # 而带 reasoning_effort=low 时模型自己会 stop，不会把额度烧在思考上
    # （不带这个参数裸调，16384 token 全进思考、可见输出 0 字符）。
    # 真撞上上限也不会留下半截产物 —— call() 见到 finish_reason=length 会续写。
    max_tokens: 20000

  gw5:
    type: openai_compat
    label: "备用聚合网关"
    base_url: ${NOVEL_GW5_URL}
    api_key: ${NOVEL_GW5_KEY:-EMPTY}
    default_model: ${NOVEL_GW5_MODEL}
    reasoning_field: reasoning_content
    thinking_style: effort
    thinking_levels: {"off": low, "on": high}
    context_window: 128000
    max_tokens: 8192

  gw6:
    type: openai_compat
    label: "阿里官方百炼独占实例"
    base_url: ${NOVEL_GW6_URL}
    api_key: ${NOVEL_GW6_KEY:-EMPTY}
    default_model: ${NOVEL_GW6_MODEL}
    reasoning_field: reasoning_content
    # Qwen 系默认开思考(实测短提示词就吃掉 172 reasoning tokens), 但它支持
    # enable_thinking=false 彻底关掉。实测同一条 6.2 万字提示词:
    #   不传参数            → 4 分钟超时
    #   enable_thinking=false → 36s, 但质量掉下来: 8 项文体指标只有 5 项落在
    #                          原作 p10~p90 内, **一段制度解说都没有**(解说体 0),
    #                          叹号 1.28(原作 8.8~9.2), 人物全在端着
    #   reasoning_effort=low  → 109s, 烧 4096 思考 token, 但 **8/8 项全达标**
    # 写小说是质量优先, 所以留思考、只调到最低档。慢 3 倍换 8/8, 而且 flash
    # 本身只有 max 十分之一的价, 这笔账很划算。
    thinking_style: effort
    thinking_levels: {"off": low, "on": high}
    context_window: 128000
    max_tokens: 20000

# 检索源 —— 与模型网关并列的一类 provider。加一家 = 加一段 YAML。
# 写作时自动用于世界观/人物/剧情/正文的背景落地，不需要单独触发。
search:
  default: bocha
  providers:
    # 按次计费的中文搜索 API。密钥走 .env（NOVEL_BOCHA_KEY），绝不进 git。
    # 结果跨书共享缓存（.cache/search），真实请求逐次计数（search_usage.json），
    # 缓存命中不计费。
    bocha:
      type: bocha
      label: "博查 AI 搜索"
      api_key: ${NOVEL_BOCHA_KEY:-EMPTY}
      timeout: 30
      freshness: noLimit

    # 备用源，保留可插拔。实测本地实例名义启用 85 家、实际只有 2 家在服务，
    # 且 bing 返回的一半是短视频与电商 —— 只在博查不可用时兜底。
    local_searxng:
      type: searxng
      label: "本地 SearXNG"
      endpoint: ${NOVEL_SEARCH_URL:-http://127.0.0.1:18888}
      lang: zh-CN
      timeout: 20
      # 只打实测有效的引擎，按质量排序（用 !bang 定向，engines= 参数无效）。
      # 实测同一条中文考据检索：
      #   yandex 15 条，中文站命中率最高（国学网/政府站/学术专栏）
      #   bing   10 条，其中 4 条是 TikTok 与抖音教程 —— 保留但排在后面
      #   baidu / sogou    Suspended: CAPTCHA（实例被封，配代理才能用）
      #   google cse       too many requests
      #   wikipedia / duckduckgo / scholar   零响应
      # 换实例或修好上面几家之后，把它们按质量插进这个列表即可。
      engines: [yandex, bing]

# 任务 -> 网关 的分层调度。创作类关思考（实测开思考挤爆 token 且不提质）
# 分层调度。创作类关思考 —— 对照实验结论: deepseek-v4-flash 全流程开思考后
# 角色档案少 41%、时代红线卡少 65%、细纲慢 2.6 倍，产出更薄而不是更好。
# 通用开启思考。实测同一条 6.2 万字提示词、同一个 qwen3.8-flash：
#   关思考(enable_thinking=false) 36s，但 8 项文体指标只有 5 项落在原作
#     p10~p90 内，**一段制度解说都没有**、叹号 1.28（原作 8.8~9.2）
#   开思考最低档 109~133s，**8/8 全达标**
# 写小说是质量优先，慢 3 倍换全达标划算；flash 本身只有 max 十分之一的价。
# ⚠ 但「档位越高越好」目前**没有数据支持**：单次采样里 medium(1744 思考 tok)
#   反而比 low(4096) 差(3/7 vs 6/7)，这个端点上 effort 似乎不单调。
#   要改档位先跑 /tmp/efforttest.py 那套多次采样，别凭直觉调。
# 2026-09-11 全部切到 gw6(自建 Qwen3.8-Flash-Next)。聚合网关 gw4/gw5 从 09-10
# 22:32 起返回 401 Invalid token, 空转 15 小时 686 次。而且树式分解把每次调用的
# 上下文压到几千字, 正配自建实例: 窗口小、便宜、可以随便发。
#
# 温度按用户要求拉满。注意分工不同:
#   drafting/planning 要野 —— 温度低会把「剧情太标」坐实(每块都走同一套流程)
#   judging 必须低 —— 它是尺子, 尺子自己会飘就没法比较章与章
profiles:
  # planning 开思考(2026-09-11 用户要求): 规划/拆里程碑最吃推理 —— 候选A 的
  # 14 处违约就是不思考的 flash 干规划的产物。旧的「开思考4分钟超时」测量
  # 条件已变: 那是聚合网关+6万字提示词; 现在自建实例+树式短提示词(三四千字)。
  # drafting 仍关: 正文输出长, 思考会挤掉正文额度。
  planning:   {gateway: gw6, thinking: true, temperature: 1.0}
  drafting:   {gateway: gw6, thinking: false, temperature: 1.0}
  polishing:  {gateway: gw6, thinking: false, temperature: 0.95}
  # judging 原来关着思考，理由是「推理与答案共用 max_tokens，2000 的判定任务
  # 会被推理吃光、可见输出 0 字符」。但 call() 里已经有兜底：开思考且网关是
  # effort 型时会自动把 max_tokens 放大（×倍数、下限 6000、封顶网关上限），
  # 所以那个风险已经被堵住了。而评审现在多挂了本书文风包声明的 5 条维度
  # （当众失态／温度／把规矩讲透／叙述者戳破／有人算错），要真读出这些更需要推理。
  # 如果发现评审又出现「首次输出为空、靠关思考重试才拿到结果」，把这里改回 false。
  judging:    {gateway: gw6, thinking: false, temperature: 0.30}

default_profile: drafting
